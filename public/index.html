<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Lumo · AI Chat</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
<script src="https://cdn.jsdelivr.net/npm/marked@12.0.0/marked.min.js"></script>
<link rel="stylesheet" href="/style.css" />
</head>
<body>
<div class="app">
  <!-- Sidebar -->
  <aside class="sidebar" id="sidebar">
    <div class="sidebar-head">
      <div class="brand">
        <span class="brand-mark">✦</span>
        <span class="brand-name">Lumo</span>
      </div>
      <button class="new-btn" id="newChat" title="New chat">
        <svg viewBox="0 0 24 24" width="18" height="18"><path fill="currentColor" d="M12 5v14M5 12h14" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
        New
      </button>
    </div>
    <nav class="conv-list" id="convList"></nav>
    <div class="sidebar-foot">
      <div class="status" id="status"><span class="dot"></span><span id="statusText">Ready</span></div>
    </div>
  </aside>

  <!-- Main -->
  <main class="main">
    <header class="topbar">
      <button class="icon-btn menu-btn" id="menuToggle" title="Menu">
        <svg viewBox="0 0 24 24" width="20" height="20"><path fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" d="M4 6h16M4 12h16M4 18h16"/></svg>
      </button>
      <h1 class="chat-title" id="chatTitle">New chat</h1>
    </header>

    <div class="messages" id="messages"></div>

    <div class="composer-wrap">
      <form class="composer" id="composer">
        <textarea id="input" rows="1" placeholder="Message Lumo…" autocomplete="off"></textarea>
        <button type="submit" class="send-btn" id="sendBtn" title="Send" disabled>
          <svg viewBox="0 0 24 24" width="20" height="20"><path fill="currentColor" d="M3 11l18-8-8 18-2-7-8-3z" opacity=".95"/></svg>
        </button>
      </form>
      <p class="disclaimer">Lumo can make mistakes. Responses come from an AI model.</p>
    </div>
  </main>
</div>
<div class="scrim" id="scrim"></div>
<script src="/app.js"></script>
</body>
</html>
